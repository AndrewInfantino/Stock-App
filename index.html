<style>
  :root{
    --bg:#FFFFFF; --panel:#FFFFFF; --panel-2:#F4F2EF; --line:#E9E6E1; --line-2:#E0DCD5;
    --ink:#17181B; --muted:#6E7480; --faint:#A6A9B0;
    --copper:#B87333; --copper-hot:#C9863F; --copper-soft:#DEC1A2; --copper-tint:rgba(184,115,51,.10);
    --up:#178A5A; --down:#D23B3B; --hit:#178A5A; --far:#8AA0C4;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:radial-gradient(900px 500px at 84% -8%, rgba(184,115,51,.05), transparent 62%),var(--bg);
    color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px 48px}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 74%,rgba(255,255,255,0));
    padding:calc(env(safe-area-inset-top) + 16px) 2px 8px}
  .titlerow{display:flex;align-items:center;justify-content:space-between;gap:12px}
  h1{font-size:23px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  h1 .tick{font-family:"JetBrains Mono",monospace;font-size:11px;font-weight:700;color:#fff;
    background:var(--copper);padding:2px 6px;border-radius:5px;transform:translateY(-2px)}
  .refresh{background:#fff;border:1px solid var(--copper-soft);color:var(--copper);border-radius:10px;
    padding:9px 13px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;
    align-items:center;gap:7px;transition:.15s}
  .refresh:active{transform:scale(.97);background:var(--copper-tint)}.refresh:disabled{opacity:.6}
  .spin{width:12px;height:12px;border:2px solid var(--copper-soft);border-top-color:var(--copper);border-radius:50%;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .sub{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted)}
  .sub b{color:var(--ink);font-weight:600}
  .stamp{color:var(--faint)}

  .search{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--ink);
    padding:11px 14px;font-size:15px;font-family:inherit;margin:12px 0 8px}
  .search:focus{outline:none;border-color:var(--copper-soft);background:#fff}
  .search::placeholder{color:var(--faint)}

  .sorts{display:flex;gap:7px;margin-bottom:12px;flex-wrap:wrap}
  .chip{background:#fff;border:1px solid var(--line-2);color:var(--muted);border-radius:99px;
    padding:7px 13px;font-size:12.5px;font-family:inherit;font-weight:500;cursor:pointer;transition:.15s;display:flex;align-items:center;gap:5px}
  .chip:active{transform:scale(.97)}
  .chip.active{background:var(--copper-tint);border-color:var(--copper-soft);color:var(--copper)}

  details.adder{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:0 0 14px;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,20,.03)}
  details.adder summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:13.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
  details.adder summary::-webkit-details-marker{display:none}
  details.adder[open] summary{color:var(--ink);border-bottom:1px solid var(--line)}
  .adder-body{padding:12px 14px;display:flex;gap:9px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.tk{flex:1;min-width:100px}.field.pr{flex:1;min-width:110px}
  .field label{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
  .field input{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
    padding:11px 12px;font-size:16px;font-family:"JetBrains Mono",monospace;width:100%}
  .field input:focus{outline:none;border-color:var(--copper-soft);background:#fff}
  .add-btn{background:var(--copper);color:#fff;border:none;border-radius:9px;padding:12px 18px;
    font-family:inherit;font-weight:600;font-size:14px;cursor:pointer;height:44px}
  .add-btn:active{transform:scale(.97);background:var(--copper-hot)}

  .list{display:flex;flex-direction:column;gap:9px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 15px 15px;
    position:relative;overflow:hidden;box-shadow:0 1px 2px rgba(20,20,20,.04),0 2px 10px rgba(20,20,20,.02)}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:0;transition:.25s;background:var(--far)}
  .card.b20::before,.card.b15::before,.card.b10::before{opacity:.85;background:var(--copper)}
  .card.hit::before{opacity:.85;background:var(--hit)}
  .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .ident{min-width:0}
  .tkr-line{display:flex;align-items:center;gap:8px}
  .tkr{font-size:18px;font-weight:700;letter-spacing:.01em}
  .day{font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
  .day.up{color:var(--up);background:rgba(23,138,90,.10)}
  .day.down{color:var(--down);background:rgba(210,59,59,.10)}
  .day.flat{color:var(--faint);background:var(--panel-2)}
  .name{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:28ch;margin-top:3px}
  .pctbox{text-align:right;flex-shrink:0}
  .pct{font-family:"JetBrains Mono",monospace;font-size:22px;font-weight:700;line-height:1}
  .pct.far{color:var(--muted)}.pct.b20{color:#B98A5A}.pct.b15{color:var(--copper)}
  .pct.b10{color:#A85B22}.pct.hit{color:var(--hit)}.pct.none{color:var(--faint);font-size:14px}
  .pctlabel{font-size:10.5px;color:var(--faint);margin-top:3px;letter-spacing:.02em}

  .track{position:relative;height:6px;background:var(--panel-2);border-radius:99px;margin:18px 0 4px}
  .fill{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--far),var(--copper));transition:width .5s cubic-bezier(.2,.7,.3,1)}
  .card.hit .fill{background:linear-gradient(90deg,var(--copper),var(--hit))}
  .tick-m{position:absolute;top:-6px;width:1px;height:18px;background:var(--line-2)}
  .tick-m span{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--faint)}
  .dot{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:var(--ink);border:3px solid #fff;transform:translate(-50%,-50%);transition:left .5s cubic-bezier(.2,.7,.3,1);box-shadow:0 0 0 1px var(--line-2)}
  .card.b20 .dot,.card.b15 .dot,.card.b10 .dot{background:var(--copper)}
  .card.hit .dot{background:var(--hit)}
  .flag{position:absolute;right:0;top:50%;transform:translate(50%,-50%);width:2px;height:16px;background:var(--faint)}

  .bot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
  .figs{display:flex;gap:18px}
  .fig{display:flex;flex-direction:column;gap:2px}
  .fig .k{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .fig .v{font-family:"JetBrains Mono",monospace;font-size:15px;font-weight:500}
  .fig .v.none{color:var(--faint);font-size:12px}
  .fig .v.tgt{cursor:pointer;border-bottom:1px dashed var(--copper-soft);color:var(--copper)}
  .del{background:none;border:none;color:var(--faint);cursor:pointer;font-size:12px;font-family:inherit;padding:6px}
  .del:active{color:var(--down)}
  .edit{width:96px;background:#fff;border:1px solid var(--copper-soft);border-radius:7px;color:var(--ink);
    padding:6px 8px;font-family:"JetBrains Mono",monospace;font-size:15px}

  .empty{border:1px dashed var(--line-2);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
  .foot{margin-top:20px;font-size:11px;color:var(--faint);line-height:1.6;text-align:center}
  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(16px);
    background:var(--ink);color:#fff;padding:11px 17px;border-radius:11px;font-size:13px;opacity:0;transition:.26s;
    pointer-events:none;z-index:60;box-shadow:0 12px 40px rgba(0,0,0,.2)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titlerow">
      <h1>Approach <span class="tick">BUY</span></h1>
      <button class="refresh" id="refreshBtn"><span id="refreshInner">&#8635; Refresh</span></button>
    </div>
    <div class="sub"><span><b id="cnt">0</b> stocks</span><span class="stamp" id="stamp"></span></div>
    <input class="search" id="search" placeholder="Search ticker or company..." autocomplete="off" />
    <div class="sorts" id="sorts">
      <button class="chip active" data-sort="closest">Closest to target</button>
      <button class="chip" data-sort="gainers">&#9650; Gainers</button>
      <button class="chip" data-sort="losers">&#9660; Losers</button>
      <button class="chip" data-sort="pe">P/E low&#8594;high</button>
    </div>
  </header>

  <details class="adder">
    <summary>&#43;&nbsp; Add a stock</summary>
    <div class="adder-body">
      <div class="field tk"><label>Ticker</label><input id="tk" class="mono" placeholder="AAPL" maxlength="12" autocomplete="off" /></div>
      <div class="field pr"><label>Target price</label><input id="pr" class="mono" placeholder="0.00" inputmode="decimal" autocomplete="off" /></div>
      <button class="add-btn" id="addBtn">Add</button>
    </div>
  </details>

  <div class="list" id="list"></div>
  <div class="foot">Live prices via public market data, ~15&nbsp;min delayed. Tap a target to change it. Your list is saved on this device.</div>
</div>
<div class="toast" id="toast"></div>

const KEY = "approach_v1";
const $ = id => document.getElementById(id);
let watch = [];
let query = "";
let sortMode = "closest";
let refreshing = false;

function load(){
  try{ const s = localStorage.getItem(KEY); if(s) watch = JSON.parse(s); }catch(e){ watch=[]; }
  if(!Array.isArray(watch) || !watch.length){
    watch = SEED.map(s => ({ticker:s.t, name:s.n, target:(s.target ?? null), price:null, change:null, pe:null, updated:null}));
    save();
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(watch)); }catch(e){} }

function bandOf(price, target){
  if(price==null || target==null || !target) return {key:"none", rank:-1, pct:null};
  const pct = (price - target)/target*100;
  if(pct <= 0)  return {key:"hit", rank:4, pct};
  if(pct <= 10) return {key:"b10", rank:3, pct};
  if(pct <= 15) return {key:"b15", rank:2, pct};
  if(pct <= 20) return {key:"b20", rank:1, pct};
  return {key:"far", rank:0, pct};
}

function addStock(){
  const t = $("tk").value.trim().toUpperCase();
  const p = parseFloat($("pr").value);
  if(!t){ toast("Enter a ticker."); return; }
  if(watch.some(w=>w.ticker===t)){ toast(t+" is already listed."); return; }
  watch.unshift({ticker:t, name:"", target:(p>0?p:null), price:null, change:null, pe:null, updated:null});
  $("tk").value=""; $("pr").value="";
  save(); render();
  fetchPrices([t]);
}
function removeStock(t){ watch = watch.filter(w=>w.ticker!==t); save(); render(); }
function setTargetVal(t,val){ const w=watch.find(x=>x.ticker===t); if(!w) return;
  const v=parseFloat(val); w.target=(v>0?v:null); save(); render(); }

function visible(){
  let arr = watch.filter(w=>{
    if(!query) return true;
    const q=query.toLowerCase();
    return w.ticker.toLowerCase().includes(q) || (w.name||"").toLowerCase().includes(q);
  });
  if(sortMode==="gainers"){
    arr.sort((a,b)=> (b.change==null?-1e9:b.change) - (a.change==null?-1e9:a.change));
  } else if(sortMode==="losers"){
    arr.sort((a,b)=> (a.change==null?1e9:a.change) - (b.change==null?1e9:b.change));
  } else if(sortMode==="pe"){
    arr.sort((a,b)=> (a.pe==null?1e12:a.pe) - (b.pe==null?1e12:b.pe));
  } else {
    arr.sort((a,b)=>{
      const ra=bandOf(a.price,a.target), rb=bandOf(b.price,b.target);
      if(rb.rank!==ra.rank) return rb.rank-ra.rank;
      if(ra.rank>=0) return (ra.pct==null?1e9:ra.pct)-(rb.pct==null?1e9:rb.pct);
      return a.ticker.localeCompare(b.ticker);
    });
  }
  return arr;
}

function dayBadge(w){
  if(w.change==null) return `<span class="day flat">--</span>`;
  const cls = w.change>0?"up":(w.change<0?"down":"flat");
  const sign = w.change>0?"+":"";
  return `<span class="day ${cls}">${sign}${fmt(w.change,2)}%</span>`;
}

function render(){
  $("cnt").textContent = watch.length;
  const rows = visible();
  const list = $("list");
  if(!rows.length){ list.innerHTML = `<div class="empty">No matches.</div>`; return; }
  list.innerHTML = rows.map(w=>{
    const bd = bandOf(w.price,w.target);
    const cls = (bd.key==="none"||bd.key==="far")?"":bd.key;
    let pctHtml, pctLabel;
    if(w.target==null){ pctHtml=`<div class="pct none">no target</div>`; pctLabel="tap to set below"; }
    else if(w.price==null){ pctHtml=`<div class="pct none">--</div>`; pctLabel="awaiting price"; }
    else if(bd.pct<=0){ pctHtml=`<div class="pct hit">${fmt(Math.abs(bd.pct),1)}%</div>`; pctLabel="below target"; }
    else { pctHtml=`<div class="pct ${bd.key}">+${fmt(bd.pct,1)}%</div>`; pctLabel="above target"; }

    let track="";
    if(w.target!=null){
      const cp = w.price==null?0:Math.max(0,Math.min(100,(30-Math.max(bd.pct,0))/30*100));
      const m=[[20,(30-20)/30*100],[15,(30-15)/30*100],[10,(30-10)/30*100]];
      track=`<div class="track"><div class="fill" style="width:${cp}%"></div>
        ${m.map(x=>`<div class="tick-m" style="left:${x[1]}%"><span>${x[0]}%</span></div>`).join("")}
        <div class="flag"></div>${w.price!=null?`<div class="dot" style="left:${cp}%"></div>`:""}</div>`;
    }
    const priceV = w.price==null?`<span class="v none">--</span>`:`<span class="v">${fmt(w.price)}</span>`;
    const tgtV = w.target==null?`<span class="v tgt" data-t="${w.ticker}">set</span>`:`<span class="v tgt" data-t="${w.ticker}">${fmt(w.target)}</span>`;
    const peV = w.pe==null?`<span class="v none">--</span>`:`<span class="v">${fmt(w.pe,1)}</span>`;

    return `<div class="card ${cls}">
      <div class="top">
        <div class="ident">
          <div class="tkr-line"><span class="tkr">${w.ticker}</span>${dayBadge(w)}</div>
          <div class="name">${w.name||""}</div>
        </div>
        <div class="pctbox">${pctHtml}<div class="pctlabel">${pctLabel}</div></div>
      </div>
      ${track}
      <div class="bot">
        <div class="figs">
          <div class="fig"><span class="k">Price</span>${priceV}</div>
          <div class="fig"><span class="k">Target</span>${tgtV}</div>
          <div class="fig"><span class="k">P/E</span>${peV}</div>
        </div>
        <button class="del" data-d="${w.ticker}">Remove</button>
      </div>
    </div>`;
  }).join("");
  list.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>removeStock(b.dataset.d));
  list.querySelectorAll("[data-t]").forEach(el=>el.onclick=()=>editTarget(el));
}

function editTarget(el){
  const t=el.dataset.t; const w=watch.find(x=>x.ticker===t);
  const inp=document.createElement("input"); inp.className="edit mono"; inp.inputMode="decimal";
  inp.value=w.target!=null?w.target:""; inp.placeholder="target";
  el.replaceWith(inp); inp.focus();
  const commit=()=>setTargetVal(t,inp.value);
  inp.onblur=commit; inp.onkeydown=e=>{ if(e.key==="Enter")inp.blur(); if(e.key==="Escape")render(); };
}

async function fetchPrices(symbols){
  try{
    const qs = encodeURIComponent(symbols.join(","));
    const r = await fetch("/api/prices?symbols="+qs);
    const j = await r.json();
    const d = j.data || {};
    let got=0;
    watch.forEach(w=>{ const q=d[w.ticker];
      if(q && typeof q.p==="number" && q.p>0){ w.price=q.p; w.change=(typeof q.c==="number"?q.c:null); w.pe=(typeof q.pe==="number"?q.pe:null); w.updated=Date.now(); got++; } });
    save(); render();
    return got;
  }catch(e){ return 0; }
}

async function refreshAll(){
  if(refreshing) return;
  refreshing=true; $("refreshBtn").disabled=true;
  const syms = watch.map(w=>w.ticker);
  const chunks=[]; for(let i=0;i<syms.length;i+=20) chunks.push(syms.slice(i,i+20));
  let total=0, done=0;
  for(const c of chunks){
    $("refreshInner").innerHTML=`<span class="spin"></span> ${Math.round(done/chunks.length*100)}%`;
    total += await fetchPrices(c); done++;
  }
  $("stamp").textContent = total?("updated "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"})):"";
  if(!total) toast("Couldn't load prices - try again in a moment.");
  refreshing=false; $("refreshBtn").disabled=false; $("refreshInner").innerHTML="&#8635; Refresh";
}

function fmt(n,d=2){ return Number(n).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}); }
let tT; function toast(m){ const el=$("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(tT); tT=setTimeout(()=>el.classList.remove("show"),2800); }

$("refreshBtn").onclick=refreshAll;
$("addBtn").onclick=addStock;
$("pr").onkeydown=e=>{ if(e.key==="Enter") addStock(); };
$("tk").onkeydown=e=>{ if(e.key==="Enter") $("pr").focus(); };
$("search").oninput=e=>{ query=e.target.value; render(); };
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("active"));
  c.classList.add("active"); sortMode=c.dataset.sort; render();
});

load(); render(); refreshAll();
</script>
</body>
</html>
